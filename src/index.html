<!DOCTYPE HTML>
<html lang="en">
<head>
  <title>Noa Examples — Minecraft Style</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <!-- PIXEL FONT (STABLE, ONLINE) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;

      background-image: url("bg.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      image-rendering: pixelated;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Press Start 2P", monospace;
      color: white;

      /* пиксельный рендер */
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    .menu {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 30px 60px;
      border: 3px solid #000;
      box-shadow: 0 0 20px #000;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #000;
    }

    h3 {
      font-size: 14px;
      margin-top: 20px;
      text-shadow: 2px 2px 0 #000;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
    }

    .mc-input {
      width: 260px;
      padding: 12px 6px;
      font-size: 12px;
      text-align: center;
      border: 3px solid #000;
      background: #666;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      margin-bottom: 12px;
      outline: none;
      text-shadow: 1px 1px 0 #000;
    }

    .mc-btn {
      display: block;
      width: 260px;
      padding: 14px 0;
      margin: 10px auto;
      background: #999;
      border: 3px solid #000;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      transition: all 0.1s ease;
    }

    .mc-btn:hover {
      background: #bbb;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="menu">

    <h1>Noa Engine Sandbox</h1>

    <!-- SEED INPUT -->
    <input
      id="seedInput"
      class="mc-input"
      type="text"
      placeholder="WORLD SEED"
    >

    <!-- GENERATE -->
    <button class="mc-btn" onclick="playWithSeed()">
      GENERATE WORLD
    </button>

    <!-- RANDOM -->
    <button class="mc-btn" onclick="randomSeed()">
      RANDOM SEED
    </button>

    <h3>Made by:</h3>
    <ul>
      <li>Maeva Anastasia</li>
      <li>Babenco Iaroslava</li>
    </ul>

  </div>

  <script>
    const seedInput = document.getElementById("seedInput");

    function randomSeed() {
      const seed = Math.floor(Math.random() * 999999999);
      seedInput.value = seed;
    }

    function playWithSeed() {
      let seed = seedInput.value.trim();

      if (!seed) {
        seed = Math.floor(Math.random() * 999999999);
      }

      localStorage.setItem("worldSeed", seed);
      window.location.href = "hello-world/";
    }
  </script>

</body>
</html>
