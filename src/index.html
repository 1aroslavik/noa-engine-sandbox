<!DOCTYPE HTML>
<html lang="en">
<head>
  <title>Noa Examples — Minecraft Style</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <!-- PIXEL FONT (STABLE, ONLINE) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <style>
    .game-tip {
  margin-top: 20px;
  margin-left: 20px;
  max-width: 320px;
  font-size: 11px;
  line-height: 1.6;
  color: #ffd27d;

  text-shadow: 2px 2px 0 #000;
  opacity: 0;
  transition: opacity 0.6s ease;
}

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;

      background-image: url("bg.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      image-rendering: pixelated;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Press Start 2P", monospace;
      color: white;

      /* пиксельный рендер */
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    .menu {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 30px 60px;
      border: 3px solid #000;
      box-shadow: 0 0 20px #000;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #000;
    }

    h3 {
      font-size: 14px;
      margin-top: 20px;
      text-shadow: 2px 2px 0 #000;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
    }

    .mc-input {
      width: 260px;
      padding: 12px 6px;
      font-size: 12px;
      text-align: center;
      border: 3px solid #000;
      background: #666;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      margin-bottom: 12px;
      outline: none;
      text-shadow: 1px 1px 0 #000;
    }

    .mc-btn {
      display: block;
      width: 260px;
      padding: 14px 0;
      margin: 10px auto;
      background: #999;
      border: 3px solid #000;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      transition: all 0.1s ease;
    }

    .mc-btn:hover {
      background: #bbb;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="menu">

    <h1>Noa Engine Sandbox</h1>

    <!-- SEED INPUT -->
    <input
      id="seedInput"
      class="mc-input"
      type="text"
      placeholder="WORLD SEED"
    >

    <!-- GENERATE -->
    <button class="mc-btn" onclick="playWithSeed()">
      GENERATE WORLD
    </button>

    <!-- RANDOM -->
    <button class="mc-btn" onclick="randomSeed()">
      RANDOM SEED
    </button>

    <h3>Made by:</h3>
    <ul>
      <li>Maeva Anastasia</li>
      <li>Babenco Iaroslava</li>
      <div id="gameTip" class="game-tip">
  Bears can fight back.
</div>

    </ul>

  </div>

  <script>
    const seedInput = document.getElementById("seedInput");

    function randomSeed() {
      const seed = Math.floor(Math.random() * 999999999);
      seedInput.value = seed;
    }

    function playWithSeed() {
      let seed = seedInput.value.trim();

      if (!seed) {
        seed = Math.floor(Math.random() * 999999999);
      }

      localStorage.setItem("worldSeed", seed);
      window.location.href = "hello-world/";
    }
     const tips = [
    "Bears can fight back. Be careful.",
    "Double-click meat in your inventory to restore health.",
    "Different meat restores different amounts of health.",
    "Polar bears are more dangerous than they look.",
    "Watch animals closely — they react to damage.",
    "Meat from bears restores more health than pork.",
    "Animals may panic and run away when hit.",
    "Don't like the textures? Just reload the page — they will change.",
  "Do you really feel okay killing bears?",
  "If you see a bug — it's not a bug.",
  "Trees underwater? They just like swimming.",
  "Procedural generation means chaos is intentional.",
  "Every world is broken in its own unique way.",
  "If something looks strange — blame the seed.",
  "Nature is random. Deal with it.",
  "This world was not designed. It happened.",
  "Sometimes the world generates faster than logic.",
  "If it works — don't touch it.",
  "Reloading fixes more problems than debugging.",
  "Welcome to procedural reality.",
  "Yes, this is intended. Probably.",
  "The engine knows what it's doing. Maybe.",
  "If an animal behaves weirdly — it's thinking.",
  "Floating trees are a feature.",
  "You are not lost. The world is.",
  "Every glitch tells a story.",
  "This game is held together by math and hope."
  ];

  const tipEl = document.getElementById("gameTip");
   function showRandomTip() {
    tipEl.style.opacity = 0;

    setTimeout(() => {
      const randomIndex = Math.floor(Math.random() * tips.length);
      tipEl.textContent = tips[randomIndex];
      tipEl.style.opacity = 1;
    }, 500);
  }

  // первый показ
  showRandomTip();

  // смена каждые 4 секунды
  setInterval(showRandomTip, 4000);
  </script>

</body>
</html>
